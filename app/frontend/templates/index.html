<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>Photo Editor</h1>

    <section class="panel">
      <label class="dropzone" id="dropzone">
        <input type="file" id="file" class="visually-hidden" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
        <span class="dz-title">Kéo ảnh vào đây hoặc bấm để chọn ảnh</span>
        <span class="dz-hint">JPG, PNG, WebP, tối đa 10 MB</span>
      </label>
      <p id="status" role="status"></p>
    </section>

    <section class="panel" id="editor" hidden>
      <dl id="meta"></dl>

      <div class="toolbar">
        <button id="undo" type="button" class="secondary">Hoàn tác</button>
        <button id="redo" type="button" class="secondary">Làm lại</button>
        <button id="reset" type="button" class="secondary">Đặt lại</button>
        <span class="spacer"></span>
        <select id="fmt" aria-label="Định dạng tải xuống">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="webp">WebP</option>
        </select>
        <button id="download" type="button">Tải xuống</button>
      </div>

      <div class="tools">
        <div class="tool">
          <span class="tool-name">Màu sắc</span>
          <button type="button" data-op="grayscale">Chuyển xám</button>
        </div>

        <div class="tool">
          <label for="brightness">Độ sáng</label>
          <input type="range" id="brightness" min="-100" max="100" step="1" value="0">
          <output id="brightness-out">0</output>
          <button type="button" data-op="brightness">Áp dụng</button>
        </div>

        <div class="tool">
          <label for="contrast">Tương phản</label>
          <input type="range" id="contrast" min="0.5" max="3" step="0.1" value="1">
          <output id="contrast-out">1</output>
          <button type="button" data-op="contrast">Áp dụng</button>
        </div>

        <div class="tool">
          <label for="blur">Làm mờ (cỡ nhân)</label>
          <input type="range" id="blur" min="3" max="31" step="2" value="5">
          <output id="blur-out">5</output>
          <button type="button" data-op="blur">Áp dụng</button>
        </div>

        <div class="tool">
          <label for="sharpen">Làm nét</label>
          <select id="sharpen">
            <option value="1">Nhẹ</option>
            <option value="2" selected>Vừa</option>
            <option value="3">Mạnh</option>
          </select>
          <button type="button" data-op="sharpen">Áp dụng</button>
        </div>

        <div class="tool">
          <span class="tool-name">Xoay</span>
          <button type="button" data-op="rotate" data-params='{"angle": 270}'>Trái 90°</button>
          <button type="button" data-op="rotate" data-params='{"angle": 90}'>Phải 90°</button>
          <button type="button" data-op="rotate" data-params='{"angle": 180}'>180°</button>
        </div>

        <div class="tool">
          <span class="tool-name">Lật</span>
          <button type="button" data-op="flip" data-params='{"direction": "horizontal"}'>Ngang</button>
          <button type="button" data-op="flip" data-params='{"direction": "vertical"}'>Dọc</button>
          <button type="button" data-op="flip" data-params='{"direction": "both"}'>Cả hai</button>
        </div>

        <div class="tool">
          <span class="tool-name">Đổi kích thước (px)</span>
          <label class="inline" for="rs-width">Rộng</label>
          <input type="number" id="rs-width" min="1" step="1" inputmode="numeric">
          <label class="inline" for="rs-height">Cao</label>
          <input type="number" id="rs-height" min="1" step="1" inputmode="numeric">
          <label class="inline"><input type="checkbox" id="rs-lock" checked> Giữ tỷ lệ</label>
          <button type="button" data-op="resize">Áp dụng</button>
        </div>

        <div class="tool">
          <span class="tool-name">Cắt (tọa độ px, gốc ở góc trên trái)</span>
          <label class="inline" for="cr-x">X</label>
          <input type="number" id="cr-x" min="0" step="1" inputmode="numeric">
          <label class="inline" for="cr-y">Y</label>
          <input type="number" id="cr-y" min="0" step="1" inputmode="numeric">
          <label class="inline" for="cr-w">Rộng</label>
          <input type="number" id="cr-w" min="1" step="1" inputmode="numeric">
          <label class="inline" for="cr-h">Cao</label>
          <input type="number" id="cr-h" min="1" step="1" inputmode="numeric">
          <button type="button" data-op="crop">Áp dụng</button>
        </div>
                <div class="tool">
          <label for="rf-angle">Xoay tự do (độ, chiều kim đồng hồ)</label>
          <input type="range" id="rf-angle" min="-180" max="180" step="1" value="0">
          <output id="rf-angle-out">0</output>
          <button type="button" data-op="rotate_free">Áp dụng</button>
        </div>

        <div class="tool">
          <span class="tool-name">Đổi kích thước theo %</span>
          <label class="inline" for="rp-percent">Tỷ lệ (%)</label>
          <input type="number" id="rp-percent" min="1" max="1000" step="1" value="100" inputmode="numeric">
          <button type="button" data-op="resize_percent">Áp dụng</button>
        </div>

        <div class="tool">
          <span class="tool-name">Cắt theo tỷ lệ (căn giữa)</span>
          <button type="button" data-op="crop_ratio" data-params='{"ratio": "1:1"}'>1:1</button>
          <button type="button" data-op="crop_ratio" data-params='{"ratio": "4:3"}'>4:3</button>
          <button type="button" data-op="crop_ratio" data-params='{"ratio": "16:9"}'>16:9</button>
        </div>

        <div class="tool">
          <span class="tool-name">Cân bằng sáng</span>
          <div>
            <label class="inline" for="clahe-clip">Ngưỡng cắt</label>
            <input type="range" id="clahe-clip" min="1" max="10" step="0.5" value="2">
            <output id="clahe-clip-out">2</output>
          </div>
          <div>
            <label class="inline" for="clahe-tile">Số ô mỗi chiều</label>
            <input type="range" id="clahe-tile" min="2" max="16" step="1" value="8">
            <output id="clahe-tile-out">8</output>
            <button type="button" data-op="clahe">Áp dụng</button>
          </div>
        </div>

        <div class="tool">
          <span class="tool-name">Bộ lọc màu</span>
          <button type="button" data-op="invert" data-params='{}'>Đảo màu</button>
          <button type="button" data-op="sepia" data-params='{}'>Sepia</button>
          <button type="button" data-op="warm" data-params='{}'>Tông ấm</button>
          <button type="button" data-op="cool" data-params='{}'>Tông lạnh</button>
          <button type="button" data-op="vintage" data-params='{}'>Vintage</button>
        </div>

        <div class="tool">
          <span class="tool-name">Tách đường viền</span>
          <div class="slider-row">
            <label class="inline" for="canny-low">Ngưỡng thấp</label>
            <input type="range" id="canny-low" min="0" max="255" step="1" value="50">
            <output id="canny-low-out" for="canny-low">50</output>
          </div>
          <div class="slider-row">
            <label class="inline" for="canny-high">Ngưỡng cao</label>
            <input type="range" id="canny-high" min="0" max="255" step="1" value="150">
            <output id="canny-high-out" for="canny-high">150</output>
          </div>
        </div>

        <div class="tool">
          <span class="tool-name">Phân ngưỡng (đen/trắng)</span>
          <label class="inline" for="th-value">Ngưỡng</label>
          <input type="range" id="th-value" min="0" max="255" step="1" value="128">
          <output id="th-value-out">128</output>
          <button type="button" data-op="threshold">Ngưỡng cố định</button>
        </div>
      </div>

      <div class="compare">
        <figure><figcaption>Ảnh gốc</figcaption><img id="orig" alt="Ảnh gốc"></figure>
        <figure><figcaption>Kết quả</figcaption><img id="result" alt="Ảnh kết quả"></figure>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
